<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIGO — B2.4.4E.3C Validação Server-side Real</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 820px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    button {
      padding: 12px 18px;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>SIGO — B2.4.4E.3C</h1>

  <p>
    Prova real: Firebase → ID token → Web App SIGO →
    validação server-side → mapeamento do usuário.
  </p>

  <p>
    O ID token não será exibido, salvo em localStorage ou copiado.
    O UID completo também não será exibido nesta página.
  </p>

  <button id="btnTestar">
    Entrar com Google e validar no servidor
  </button>

  <h2>Resultado seguro</h2>
  <pre id="resultado">Aguardando teste...</pre>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      setPersistence,
      inMemoryPersistence,
      getIdToken
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvs7xE2QhHuKF6OhXC6PNyID0Uf06FzjY",
      authDomain: "sigo-v1-0-mobile.firebaseapp.com",
      projectId: "sigo-v1-0-mobile",
      storageBucket: "sigo-v1-0-mobile.firebasestorage.app",
      messagingSenderId: "292699885751",
      appId: "1:292699885751:web:38eafdb653b1f2d5ebbd32"
    };

    const ENDPOINT =
      "https://script.google.com/macros/s/" +
      "AKfycbzVE7tdTSwHvKgLkrdcaQtGAm_muqNPo6n0wQZBDpmRwtAJuySfWyh6gdef0R6g_drKRw" +
      "/exec";

    const ACAO =
      "VALIDAR_IDENTIDADE_FIREBASE_B244E";

    const EMAIL_ESPERADO =
      "claudemirmatos14@gmail.com";

    const ID_USUARIO_ESPERADO =
      "USR-IND-B476B612655840C2";

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    await setPersistence(
      auth,
      inMemoryPersistence
    );

    const provider =
      new GoogleAuthProvider();

    provider.setCustomParameters({
      login_hint: EMAIL_ESPERADO
    });

    const btn =
      document.getElementById("btnTestar");

    const out =
      document.getElementById("resultado");

    function mostrar(obj) {
      out.textContent =
        JSON.stringify(obj, null, 2);
    }

    function contem(texto, valor) {
      return String(texto || "")
        .includes(String(valor || ""));
    }

    btn.addEventListener(
      "click",
      async () => {

        btn.disabled = true;

        mostrar({
          etapa:
            "B2_4_4E_3C_TESTE_REAL_SERVER_SIDE",
          status:
            "AUTENTICANDO"
        });

        let idToken = "";

        try {

          const cred =
            await signInWithPopup(
              auth,
              provider
            );

          const user =
            cred.user;

          const email =
            String(user.email || "")
              .trim()
              .toLowerCase();

          if (email !== EMAIL_ESPERADO) {
            throw new Error(
              "CONTA_GOOGLE_DIVERGENTE_DO_USUARIO_SIGO"
            );
          }

          if (user.emailVerified !== true) {
            throw new Error(
              "EMAIL_FIREBASE_NAO_VERIFICADO"
            );
          }

          idToken =
            await getIdToken(
              user,
              true
            );

          if (!idToken) {
            throw new Error(
              "TOKEN_FIREBASE_NAO_EMITIDO"
            );
          }

          const resposta =
            await fetch(
              ENDPOINT,
              {
                method: "POST",
                redirect: "follow",

                /*
                 * text/plain evita preflight por application/json.
                 * O corpo continua sendo JSON e doPost usa
                 * e.postData.contents normalmente.
                 */
                headers: {
                  "Content-Type":
                    "text/plain;charset=UTF-8"
                },

                body: JSON.stringify({
                  acao: ACAO,
                  firebaseIdToken: idToken
                })
              }
            );

          const textoResposta =
            await resposta.text();

          let jsonServidor = null;

          try {
            jsonServidor =
              JSON.parse(textoResposta);
          } catch (_) {
            throw new Error(
              "RESPOSTA_SERVIDOR_NAO_JSON"
            );
          }

          /*
           * O token deixa de ser necessário imediatamente.
           */
          idToken = "";

          const textoSeguro =
            JSON.stringify(
              jsonServidor
            );

          const validacoes = {

            httpOk:
              resposta.ok === true,

            respostaJson:
              !!jsonServidor,

            acaoReconhecida:
              contem(
                textoSeguro,
                ACAO
              ),

            servidorValidouIdentidade:
              contem(
                textoSeguro,
                "VALIDADO"
              ),

            candidatoPrimeiroVinculo:
              contem(
                textoSeguro,
                "CANDIDATO_PRIMEIRO_VINCULO"
              ),

            codigoMapeamentoCorreto:
              contem(
                textoSeguro,
                "USUARIO_SIGO_CANDIDATO_PRIMEIRO_VINCULO"
              ),

            idUsuarioCorreto:
              contem(
                textoSeguro,
                ID_USUARIO_ESPERADO
              ),

            emailCorreto:
              contem(
                textoSeguro,
                EMAIL_ESPERADO
              ),

            emailVerificado:
              contem(
                textoSeguro,
                '"emailVerificado":true'
              ),

            uidConfirmadoSemExporUidCompleto:
              contem(
                textoSeguro,
                '"uidConfirmado":true'
              ),

            nenhumaGravacaoUid:
              contem(
                textoSeguro,
                '"gravaUid":false'
              ),

            nenhumaSessaoCriada:
              contem(
                textoSeguro,
                '"criaSessao":false'
              ),

            nenhumDispositivoAlterado:
              contem(
                textoSeguro,
                '"alteraDispositivo":false'
              ),

            tokenNaoRetornado:
              !textoSeguro.includes(
                "firebaseIdToken"
              )
          };

          const falsas =
            Object.entries(
              validacoes
            )
            .filter(([,v]) =>
              v !== true
            )
            .map(([k]) => k);

          const resultadoSeguro = {
            etapa:
              "B2_4_4E_3C_TESTE_REAL_SERVER_SIDE",

            autenticacaoFirebase:
              true,

            httpStatus:
              resposta.status,

            emailCliente:
              email,

            emailVerifiedCliente:
              user.emailVerified === true,

            tokenFirebaseEmitido:
              true,

            tokenFirebaseExposto:
              false,

            uidClienteExposto:
              false,

            validacoes,

            totalValidacoes:
              Object.keys(
                validacoes
              ).length,

            totalFalsas:
              falsas.length,

            falsas,

            aprovado:
              falsas.length === 0,

            classificacao:
              falsas.length === 0
                ? "B2_4_4E_3C_IDENTIDADE_REAL_VALIDADA_SERVER_SIDE_E_MAPEADA_SEM_GRAVACAO"
                : "B2_4_4E_3C_VALIDACAO_REAL_COM_DIVERGENCIA",

            respostaServidor:
              jsonServidor
          };

          mostrar(
            resultadoSeguro
          );

        } catch (erro) {

          idToken = "";

          mostrar({
            etapa:
              "B2_4_4E_3C_TESTE_REAL_SERVER_SIDE",

            aprovado:
              false,

            codigo:
              erro && erro.code
                ? String(erro.code)
                : "ERRO_CONTROLADO",

            mensagem:
              erro && erro.message
                ? String(erro.message)
                : "Falha no teste.",

            tokenFirebaseExposto:
              false,

            uidClienteExposto:
              false
          });

        } finally {

          try {
            await signOut(auth);
          } catch (_) {}

          btn.disabled = false;
        }
      }
    );

  </script>
</body>
</html>
