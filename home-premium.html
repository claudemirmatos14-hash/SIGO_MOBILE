<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>
    /* SIGO_HOME_PREMIUM_COMPAT_REDIRECT_TO_INDEX_V1 */
    (function () {
      var target = "./index.html" + window.location.search + window.location.hash;
      window.location.replace(target);
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>SIGO Mobile — Home Premium</title>

  <link rel="stylesheet" href="css/premium.css" />
  <link rel="manifest" href="./manifest.json">

    <meta name="theme-color" content="#0b1f36">
    
    <meta
      name="application-name"
      content="SIGO Mobile"
    >
    
    <meta
      name="mobile-web-app-capable"
      content="yes"
    >
    
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    >
    
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    >
    
    <meta
      name="apple-mobile-web-app-title"
      content="SIGO Mobile"
    >
</head>

<body>

  <div class="app app-premium"></div>

  <script src="js/db.js"></script>
  <script src="js/sigo-ui.js"></script>
  <script src="js/entities.js"></script>
  <script src="js/data-crud.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/sync/helpers.js"></script>
<script src="js/tenant-auth/helpers.js"></script>
<script src="js/field-operations/medicoes.js"></script>
<script src="js/field-operations/clima.js"></script>
<script src="js/field-operations/ocorrencias.js"></script>
<script src="js/field-operations/diario.js"></script>
<script src="js/data/obras.js"></script>
<script src="js/field/operations.js"></script>
<script src="js/app.js"></script>
<script src="js/core/compatibility.js"></script>
  <script src="js/sigo-remote-cleanup.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const app = document.querySelector(".app-premium");

      if (!app) {
        console.error("[SIGO] Container .app-premium não encontrado.");
        return;
      }

      try {
        if (typeof montarHomePremium !== "function") {
          throw new Error("montarHomePremium indisponível.");
        }

        const html = await montarHomePremium();

        if (typeof html !== "string" || !html.trim()) {
          throw new Error("montarHomePremium não retornou HTML válido.");
        }

        app.innerHTML = html;
        localStorage.setItem("telaAtualMobile", "home");

        if (typeof carregarIndicadoresHomePremium === "function") {
          await carregarIndicadoresHomePremium();
        }

        if (typeof atualizarIndicadoresMobile_ === "function") {
          await atualizarIndicadoresMobile_();
        }

        if (typeof instalarAcaoReidratacaoUX1958_ === "function") {
          await instalarAcaoReidratacaoUX1958_();
        }
      } catch (erro) {
        console.error("[SIGO] Falha ao iniciar Home Premium:", erro);

        const mensagem =
          erro && erro.message
            ? erro.message
            : String(erro || "Erro desconhecido");

        app.innerHTML =
          `<main class="home-premium">
            <section class="sigo-card">
              <h2>Falha ao iniciar o SIGO Mobile</h2>
              <p id="sigoBootstrapError"></p>
            </section>
          </main>`;

        const erroEl = document.getElementById("sigoBootstrapError");
        if (erroEl) erroEl.textContent = mensagem;
      }
    });
  </script>

</body>
</html>
