<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SIGO — B2.4.4F.4C.1 Prova do Patch Publicado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 860px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
    }
    button {
      padding: 12px 18px;
      cursor: pointer;
    }
    pre {
      white-space: pre-wrap;
      word-break: break-word;
      padding: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>SIGO — B2.4.4F.4C.1</h1>

  <p>
    Prova real do patch publicado de auditoria server-side.
  </p>

  <p>
    A autenticação positiva deve gerar um ID_AUTENTICACAO_SERVIDOR
    auditável, sem gravar o UID no usuário SIGO e sem criar sessão.
  </p>

  <button id="btnTestar">
    Entrar com Google e validar patch publicado
  </button>

  <h2>Resultado seguro</h2>
  <pre id="resultado">Aguardando teste...</pre>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut,
      setPersistence,
      inMemoryPersistence,
      getIdToken
    } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDvs7xE2QhHuKF6OhXC6PNyID0Uf06FzjY",
      authDomain: "sigo-v1-0-mobile.firebaseapp.com",
      projectId: "sigo-v1-0-mobile",
      storageBucket: "sigo-v1-0-mobile.firebasestorage.app",
      messagingSenderId: "292699885751",
      appId: "1:292699885751:web:38eafdb653b1f2d5ebbd32"
    };

    const ENDPOINT =
      "https://script.google.com/macros/s/" +
      "AKfycbzVE7tdTSwHvKgLkrdcaQtGAm_muqNPo6n0wQZBDpmRwtAJuySfWyh6gdef0R6g_drKRw" +
      "/exec";

    const ACAO =
      "VALIDAR_IDENTIDADE_FIREBASE_B244E";

    const EMAIL_ESPERADO =
      "claudemirmatos14@gmail.com";

    const ID_USUARIO_ESPERADO =
      "USR-IND-B476B612655840C2";

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    await setPersistence(
      auth,
      inMemoryPersistence
    );

    const provider =
      new GoogleAuthProvider();

    provider.setCustomParameters({
      login_hint: EMAIL_ESPERADO
    });

    const btn =
      document.getElementById("btnTestar");

    const out =
      document.getElementById("resultado");

    function mostrar(obj) {
      out.textContent =
        JSON.stringify(obj, null, 2);
    }

    function obterDetalhes_(obj) {

      if (
        !obj ||
        typeof obj !== "object"
      ) {
        return {};
      }

      return (
        obj.detalhes ||
        obj.details ||
        {}
      );
    }

    btn.addEventListener(
      "click",
      async () => {

        btn.disabled = true;

        mostrar({
          etapa:
            "B2_4_4F_4C_1_BLACK_BOX_PATCH_AUDITORIA_PUBLICADO",
          status:
            "AUTENTICANDO"
        });

        let idToken = "";

        try {

          const cred =
            await signInWithPopup(
              auth,
              provider
            );

          const user =
            cred.user;

          const email =
            String(
              user.email || ""
            )
            .trim()
            .toLowerCase();

          if (
            email !== EMAIL_ESPERADO
          ) {
            throw new Error(
              "CONTA_GOOGLE_DIVERGENTE_DO_USUARIO_SIGO"
            );
          }

          if (
            user.emailVerified !== true
          ) {
            throw new Error(
              "EMAIL_FIREBASE_NAO_VERIFICADO"
            );
          }

          idToken =
            await getIdToken(
              user,
              true
            );

          if (!idToken) {
            throw new Error(
              "TOKEN_FIREBASE_NAO_EMITIDO"
            );
          }

          const resposta =
            await fetch(
              ENDPOINT,
              {
                method: "POST",
                redirect: "follow",
                headers: {
                  "Content-Type":
                    "text/plain;charset=UTF-8"
                },
                body: JSON.stringify({
                  acao: ACAO,
                  firebaseIdToken:
                    idToken
                })
              }
            );

          const texto =
            await resposta.text();

          let jsonServidor = null;

          try {
            jsonServidor =
              JSON.parse(texto);
          } catch (_) {
            throw new Error(
              "RESPOSTA_SERVIDOR_NAO_JSON"
            );
          }

          idToken = "";

          const detalhes =
            obterDetalhes_(
              jsonServidor
            );

          const mapeamento =
            detalhes.mapeamento ||
            {};

          const idAutenticacaoServidor =
            String(
              detalhes
                .idAutenticacaoServidor ||
              ""
            ).trim();

          const validacoes = {

            httpOk:
              resposta.ok === true,

            respostaJson:
              Boolean(
                jsonServidor &&
                typeof jsonServidor ===
                  "object"
              ),

            acaoReconhecida:
              detalhes.acao ===
              ACAO,

            servidorValidouIdentidade:
              detalhes.resultado ===
              "VALIDADO",

            idAutenticacaoServidorPresente:
              Boolean(
                idAutenticacaoServidor
              ),

            prefixoIdAutenticacaoCorreto:
              idAutenticacaoServidor
                .startsWith(
                  "AUTH-SRV-"
                ),

            idUsuarioCorreto:
              String(
                mapeamento.idUsuario ||
                ""
              ) ===
              ID_USUARIO_ESPERADO,

            emailCorreto:
              String(
                mapeamento
                  .emailAutenticacao ||
                ""
              )
              .trim()
              .toLowerCase() ===
              EMAIL_ESPERADO,

            statusUsuarioAtivo:
              String(
                mapeamento
                  .statusUsuario ||
                ""
              ).toUpperCase() ===
              "ATIVO",

            candidatoPrimeiroVinculo:
              String(
                mapeamento
                  .tipoMapeamento ||
                ""
              ) ===
              "CANDIDATO_PRIMEIRO_VINCULO",

            nenhumaGravacaoUid:
              detalhes.gravaUid ===
              false,

            nenhumaSessaoCriada:
              detalhes.criaSessao ===
              false,

            nenhumDispositivoAlterado:
              detalhes
                .alteraDispositivo ===
              false,

            tokenNaoRetornado:
              !JSON.stringify(
                jsonServidor
              ).includes(
                "firebaseIdToken"
              )
          };

          const falsas =
            Object.entries(
              validacoes
            )
            .filter(([, valor]) =>
              valor !== true
            )
            .map(([nome]) =>
              nome
            );

          const resultadoSeguro = {

            etapa:
              "B2_4_4F_4C_1_BLACK_BOX_PATCH_AUDITORIA_PUBLICADO",

            autenticacaoFirebase:
              true,

            httpStatus:
              resposta.status,

            email:
              email,

            idAutenticacaoServidor:
              idAutenticacaoServidor,

            tokenFirebaseExposto:
              false,

            uidClienteExposto:
              false,

            validacoes,

            totalValidacoes:
              Object.keys(
                validacoes
              ).length,

            totalFalsas:
              falsas.length,

            falsas,

            aprovado:
              falsas.length === 0,

            classificacao:
              falsas.length === 0
                ? "B2_4_4F_4C_1_AUTENTICACAO_POSITIVA_PUBLICADA_COM_ID_AUDITAVEL"
                : "B2_4_4F_4C_1_PATCH_PUBLICADO_COM_DIVERGENCIA",

            proximaEtapa:
              falsas.length === 0
                ? "B2_4_4F_4C_2_CONFIRMAR_EVENTO_PERSISTIDO_NO_SERVIDOR"
                : "ANALISAR_APENAS_VALIDACOES_FALSAS"
          };

          mostrar(
            resultadoSeguro
          );

        } catch (erro) {

          idToken = "";

          mostrar({
            etapa:
              "B2_4_4F_4C_1_BLACK_BOX_PATCH_AUDITORIA_PUBLICADO",

            aprovado:
              false,

            codigo:
              erro && erro.code
                ? String(erro.code)
                : "ERRO_CONTROLADO",

            mensagem:
              erro && erro.message
                ? String(erro.message)
                : "Falha na prova publicada.",

            tokenFirebaseExposto:
              false,

            uidClienteExposto:
              false
          });

        } finally {

          try {
            await signOut(auth);
          } catch (_) {}

          btn.disabled = false;
        }
      }
    );

  </script>
</body>
</html>
